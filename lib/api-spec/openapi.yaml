openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Smart Attendance Biometric System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: employees
    description: Employee management
  - name: attendance
    description: Attendance records
  - name: dashboard
    description: Dashboard statistics
  - name: reports
    description: Reporting and export
  - name: biometric
    description: Biometric (WebAuthn) registration and authentication

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login (admin or employee)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Unauthorized

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user info
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: List all employees
      security:
        - bearerAuth: []
      parameters:
        - name: department
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"
    post:
      operationId: createEmployee
      tags: [employees]
      summary: Create a new employee
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"

  /employees/{id}:
    get:
      operationId: getEmployee
      tags: [employees]
      summary: Get employee by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          description: Not found
    patch:
      operationId: updateEmployee
      tags: [employees]
      summary: Update an employee
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
    delete:
      operationId: deleteEmployee
      tags: [employees]
      summary: Delete an employee
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /employees/lookup/{employeeId}:
    get:
      operationId: lookupEmployee
      tags: [employees]
      summary: Look up employee by employee ID string (for attendance terminal)
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Employee found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          description: Not found

  /attendance:
    get:
      operationId: listAttendance
      tags: [attendance]
      summary: List attendance records
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          schema:
            type: string
        - name: employeeId
          in: query
          schema:
            type: string
        - name: department
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of attendance records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceRecord"
    post:
      operationId: timeIn
      tags: [attendance]
      summary: Record time-in for an employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimeInInput"
      responses:
        "201":
          description: Time-in recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"
        "409":
          description: Already timed in today

  /attendance/{id}/timeout:
    patch:
      operationId: timeOut
      tags: [attendance]
      summary: Record time-out for an existing attendance record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimeOutInput"
      responses:
        "200":
          description: Time-out recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"
        "404":
          description: Record not found

  /attendance/today/{employeeId}:
    get:
      operationId: getTodayAttendance
      tags: [attendance]
      summary: Get today's attendance record for an employee
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Today's attendance record (or null if none)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceTodayResponse"

  /attendance/history:
    get:
      operationId: listEmployeeHistory
      tags: [attendance]
      summary: Get attendance history for a specific employee
      security:
        - bearerAuth: []
      parameters:
        - name: employeeId
          in: query
          required: true
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Employee attendance history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceRecord"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get today's dashboard summary statistics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/departments:
    get:
      operationId: getDepartmentBreakdown
      tags: [dashboard]
      summary: Get attendance breakdown by department for today
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Department breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DepartmentStat"

  /dashboard/weekly:
    get:
      operationId: getWeeklyAttendance
      tags: [dashboard]
      summary: Get attendance count per day for the past 7 days
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Weekly attendance trend
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyCount"

  /dashboard/recent:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get the 10 most recent attendance events
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceRecord"

  /reports/export:
    get:
      operationId: exportReport
      tags: [reports]
      summary: Export attendance report as CSV
      security:
        - bearerAuth: []
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [csv, json]
          required: true
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - name: employeeId
          in: query
          schema:
            type: string
        - name: department
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Report file
          content:
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceRecord"

  /settings:
    get:
      operationId: getSettings
      tags: [dashboard]
      summary: Get office attendance settings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceSettings"
    patch:
      operationId: updateSettings
      tags: [dashboard]
      summary: Update office attendance settings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceSettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceSettings"

  /biometric/register/begin:
    post:
      operationId: biometricRegisterBegin
      tags: [biometric]
      summary: Begin WebAuthn biometric registration for an employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BiometricEmployeeInput"
      responses:
        "200":
          description: Registration options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BiometricOptions"
        "404":
          description: Employee not found

  /biometric/register/finish:
    post:
      operationId: biometricRegisterFinish
      tags: [biometric]
      summary: Finish WebAuthn biometric registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BiometricFinishInput"
      responses:
        "200":
          description: Biometric registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BiometricResult"
        "400":
          description: Verification failed

  /biometric/authenticate/begin:
    post:
      operationId: biometricAuthBegin
      tags: [biometric]
      summary: Begin WebAuthn biometric authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BiometricEmployeeInput"
      responses:
        "200":
          description: Authentication options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BiometricOptions"
        "404":
          description: No biometric registered for this employee

  /biometric/authenticate/finish:
    post:
      operationId: biometricAuthFinish
      tags: [biometric]
      summary: Finish WebAuthn biometric authentication — returns employee on success
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BiometricFinishInput"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "400":
          description: Verification failed

  /biometric/discover/begin:
    post:
      operationId: biometricDiscoverBegin
      tags: [biometric]
      summary: Begin discoverable biometric authentication (no employee ID required)
      responses:
        "200":
          description: Authentication options with discover key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BiometricDiscoverOptions"

  /biometric/discover/finish:
    post:
      operationId: biometricDiscoverFinish
      tags: [biometric]
      summary: Finish discoverable biometric authentication — returns employee on success
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BiometricDiscoverFinishInput"
      responses:
        "200":
          description: Authenticated employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "400":
          description: Verification failed

  /biometric/status/{employeeId}:
    get:
      operationId: biometricStatus
      tags: [biometric]
      summary: Check if an employee has a registered biometric
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Biometric status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BiometricStatusData"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [admin, employee]

    AuthResponse:
      type: object
      required: [token, role]
      properties:
        token:
          type: string
        role:
          type: string
        employeeId:
          type: ["string", "null"]
        username:
          type: string

    Employee:
      type: object
      required: [id, employeeId, fullName, department, position]
      properties:
        id:
          type: integer
        employeeId:
          type: string
        fullName:
          type: string
        department:
          type: string
        position:
          type: string
        phone:
          type: ["string", "null"]
        profilePhoto:
          type: ["string", "null"]
        biometricId:
          type: ["string", "null"]
        createdAt:
          type: string

    EmployeeInput:
      type: object
      required: [employeeId, fullName, department, position]
      properties:
        employeeId:
          type: string
        fullName:
          type: string
        department:
          type: string
        position:
          type: string
        phone:
          type: string
        profilePhoto:
          type: string
        biometricId:
          type: string

    EmployeeUpdate:
      type: object
      properties:
        fullName:
          type: string
        department:
          type: string
        position:
          type: string
        phone:
          type: string
        profilePhoto:
          type: string
        biometricId:
          type: string

    AttendanceRecord:
      type: object
      required: [id, employeeId, date, timeIn]
      properties:
        id:
          type: integer
        employeeId:
          type: string
        employeeName:
          type: ["string", "null"]
        department:
          type: ["string", "null"]
        date:
          type: string
        timeIn:
          type: string
        timeOut:
          type: ["string", "null"]
        latitude:
          type: ["number", "null"]
        longitude:
          type: ["number", "null"]
        locationAddress:
          type: ["string", "null"]
        timeOutLatitude:
          type: ["number", "null"]
        timeOutLongitude:
          type: ["number", "null"]
        timeOutLocationAddress:
          type: ["string", "null"]
        workingHours:
          type: ["number", "null"]
        overtimeHours:
          type: ["number", "null"]
        undertimeHours:
          type: ["number", "null"]
        status:
          type: string
          enum: [present, late, absent, half_day]
        createdAt:
          type: string

    AttendanceTodayResponse:
      type: object
      properties:
        record:
          oneOf:
            - $ref: "#/components/schemas/AttendanceRecord"
            - type: "null"

    TimeInInput:
      type: object
      required: [employeeId]
      properties:
        employeeId:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        locationAddress:
          type: string

    TimeOutInput:
      type: object
      properties:
        latitude:
          type: number
        longitude:
          type: number
        locationAddress:
          type: string
        timeOutLatitude:
          type: number
        timeOutLongitude:
          type: number
        timeOutLocationAddress:
          type: string

    DashboardStats:
      type: object
      required: [totalEmployees, presentToday, lateToday, absentToday, onTimeToday]
      properties:
        totalEmployees:
          type: integer
        presentToday:
          type: integer
        lateToday:
          type: integer
        absentToday:
          type: integer
        onTimeToday:
          type: integer
        attendanceRate:
          type: number

    DepartmentStat:
      type: object
      required: [department, present, total]
      properties:
        department:
          type: string
        present:
          type: integer
        total:
          type: integer

    DailyCount:
      type: object
      required: [date, count]
      properties:
        date:
          type: string
        count:
          type: integer
        lateCount:
          type: integer

    AttendanceSettings:
      type: object
      required: [id, officeStartTime, lateThresholdMinutes]
      properties:
        id:
          type: integer
        officeStartTime:
          type: string
        lateThresholdMinutes:
          type: integer
        officeEndTime:
          type: string
        workdayHours:
          type: number
        mondayWorkdayHours:
          type: ["number", "null"]
        tuesdayWorkdayHours:
          type: ["number", "null"]
        wednesdayWorkdayHours:
          type: ["number", "null"]
        thursdayWorkdayHours:
          type: ["number", "null"]
        fridayWorkdayHours:
          type: ["number", "null"]
        saturdayWorkdayHours:
          type: ["number", "null"]
        sundayWorkdayHours:
          type: ["number", "null"]
        companyName:
          type: ["string", "null"]
        companyLogo:
          type: ["string", "null"]
        companyAddress:
          type: ["string", "null"]
        companyPhone:
          type: ["string", "null"]
        companyEmail:
          type: ["string", "null"]

    AttendanceSettingsUpdate:
      type: object
      properties:
        officeStartTime:
          type: string
        lateThresholdMinutes:
          type: integer
        officeEndTime:
          type: string
        workdayHours:
          type: number
        mondayWorkdayHours:
          type: ["number", "null"]
        tuesdayWorkdayHours:
          type: ["number", "null"]
        wednesdayWorkdayHours:
          type: ["number", "null"]
        thursdayWorkdayHours:
          type: ["number", "null"]
        fridayWorkdayHours:
          type: ["number", "null"]
        saturdayWorkdayHours:
          type: ["number", "null"]
        sundayWorkdayHours:
          type: ["number", "null"]
        companyName:
          type: ["string", "null"]
        companyLogo:
          type: ["string", "null"]
        companyAddress:
          type: ["string", "null"]
        companyPhone:
          type: ["string", "null"]
        companyEmail:
          type: ["string", "null"]

    BiometricEmployeeInput:
      type: object
      required: [employeeId]
      properties:
        employeeId:
          type: string

    BiometricFinishInput:
      type: object
      required: [employeeId, credential]
      properties:
        employeeId:
          type: string
        credential:
          type: object
          additionalProperties: true

    BiometricOptions:
      type: object
      additionalProperties: true

    BiometricDiscoverOptions:
      type: object
      required: [discoverKey]
      properties:
        discoverKey:
          type: string
      additionalProperties: true

    BiometricDiscoverFinishInput:
      type: object
      required: [discoverKey, credential]
      properties:
        discoverKey:
          type: string
        credential:
          type: object
          additionalProperties: true

    BiometricResult:
      type: object
      required: [verified]
      properties:
        verified:
          type: boolean

    BiometricStatusData:
      type: object
      required: [registered]
      properties:
        registered:
          type: boolean
        credentialCount:
          type: integer
